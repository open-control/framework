; Open Control Framework
; Base configuration - consumers add their own lib_deps

[platformio]
default_envs = teensy41

[env]
framework = arduino
build_flags =
    -std=gnu++17
    -I src
extra_scripts =
    pre:script/pio/pre_build.py

[env:teensy41]
platform = teensy
board = teensy41
board_build.f_cpu = 450000000L
build_flags =
    ${env.build_flags}
    -D USB_MIDI_SERIAL
