; Open Control Framework - Unit Tests
;
; Usage: CXX=clang++ CC=clang pio test -e native
;
; ═══════════════════════════════════════════════════════════════════════════════
; CONFIGURABLE LIMITS
; ═══════════════════════════════════════════════════════════════════════════════
;
; Override defaults by adding -D flags to build_flags. Example:
;
;   build_flags =
;       -DOC_MAX_BUTTONS=32
;       -DOC_MAX_ENCODERS=8
;       -DOC_MAX_CONTEXTS=8
;       -DOC_MAX_PENDING_NOTIFICATIONS=32
;       -DOC_MAX_SUBSCRIBERS_PER_EVENT=16
;       -DOC_EVENTBUS_COMPACT_THRESHOLD=8
;       -DOC_MAX_SIGNAL_SUBSCRIBERS=8
;       -DOC_ENABLE_STATS=1
;
; Defaults (see src/oc/Config.hpp):
;   OC_MAX_BUTTONS               = 64
;   OC_MAX_ENCODERS              = 32
;   OC_MAX_CONTEXTS              = 16
;   OC_MAX_PENDING_NOTIFICATIONS = 64
;   OC_MAX_SUBSCRIBERS_PER_EVENT = 32
;   OC_EVENTBUS_COMPACT_THRESHOLD = 16
;   OC_MAX_SIGNAL_SUBSCRIBERS    = 4
;   OC_ENABLE_STATS              = 0
;
; ═══════════════════════════════════════════════════════════════════════════════

[platformio]
default_envs = native

[env:native]
platform = native
build_flags =
    -std=c++17
    -I src
    ; Uncomment to enable runtime statistics:
    ; -DOC_ENABLE_STATS=1
extra_scripts =
    pre:script/dev/pio_pre_check_architecture.py
test_build_src = yes

; Run architecture guardrails before executing each native test binary.
; (PlatformIO does not execute extra_scripts for test runs.)
test_testing_command =
    python
    script/dev/pio_test_runner.py
    ${platformio.build_dir}/${this.__env__}/program
