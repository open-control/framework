; Open Control Framework
; Minimal configuration for framework development

[platformio]
default_envs = teensy41

[env]
framework = arduino
build_flags =
    -std=gnu++17
    -I src

[env:teensy41]
platform = teensy
board = teensy41
board_build.f_cpu = 450000000L
build_flags =
    ${env.build_flags}
    -D USB_MIDI_SERIAL
