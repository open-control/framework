; Open Control Framework
; Configuration for framework development and testing

[platformio]
default_envs = teensy41-dev

[env]
framework = arduino
build_flags =
    -std=gnu++17
    -I src
extra_scripts =
    pre:script/pio/pre_build.py

; ═══════════════════════════════════════════════════════════════════
; Base Teensy 4.1 environment (no lib_deps - for library consumers)
; ═══════════════════════════════════════════════════════════════════
[env:teensy41]
platform = teensy
board = teensy41
board_build.f_cpu = 450000000L
build_flags =
    ${env.build_flags}
    -D USB_MIDI_SERIAL

; ═══════════════════════════════════════════════════════════════════
; Development environment with all libs for testing compilation
; ═══════════════════════════════════════════════════════════════════
[env:teensy41-dev]
extends = env:teensy41
build_flags =
    ${env:teensy41.build_flags}
    -I config/dev  ; lv_conf.h for dev builds (consumers provide their own)
lib_deps =
    https://github.com/luni64/EncoderTool
    https://github.com/vindar/ILI9341_T4
    https://github.com/PaulStoffregen/Encoder
    https://github.com/lvgl/lvgl