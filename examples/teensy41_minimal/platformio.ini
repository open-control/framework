; Open Control Framework - Minimal Teensy 4.1 Example
; 4 encoders + 2 buttons, no UI
;
; This example demonstrates:
; - Hardware configuration with constexpr definitions
; - AppBuilder for dependency injection
; - ControlAPI for input bindings (press, long press, turn)
; - MIDI output
;
; Wiring (adjust pins in include/Config.hpp):
; - Encoders: 4x quadrature encoders on GPIO pins
; - Buttons: 2x momentary switches with pull-up

[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
board_build.f_cpu = 600000000L

build_flags =
    -std=gnu++17
    -D USB_MIDI_SERIAL
    -I include
    -I ../../src

; Use framework's pre_build script for compile_commands.json generation
extra_scripts =
    pre:../../script/pio/pre_build.py

; Framework source (local development)
; For published library, replace lib_extra_dirs with:
;   lib_deps = open-control/framework
lib_extra_dirs = ../..

lib_deps =
    https://github.com/luni64/EncoderTool
    https://github.com/PaulStoffregen/Encoder
